#https://taskfile.dev/
version: "3"

vars:
  BETTERALIGN: github.com/dkorunic/betteralign/cmd/betteralign@v0.16.1
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.2
  GOFUMPT: mvdan.cc/gofumpt@v0.12.0
  REVIVE: github.com/mgechev/revive@v1.17.1
  GOTESTSUM: gotest.tools/gotestsum@v1.13.0
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.10.0

env:
  TMP: tmp

dotenv:
  - .env

# Tool *_BIN vars run `go run .`, which installs the tool if needed.
tasks:
  ci:
    desc: "run all checks"
    cmds:
      - task: tidy
      - task: format
      - task: lint
      - task: test
      - task: govulncheck

  test:
    desc: "run Go tests"
    vars:
      PKG: '{{default "./..." .PKG}}'
      FORMAT: '{{default "testdox" .FORMAT}}'
      GOTESTSUM_BIN:
        sh: go run . {{.GOTESTSUM}}
    cmds:
      - defer: rm -f coverage.out
      - |
        {{.GOTESTSUM_BIN}} \
          --format-icons=hivis \
          --format={{.FORMAT}} \
          --format-hide-empty-pkg \
          -- {{if .COUNT}}-count={{.COUNT}}{{end}} \
            -v \
            -coverprofile=coverage.out \
            {{.PKG}}
      - go tool cover -func=coverage.out

  tidy:
    desc: "run Go mod tidy"
    cmds:
      - go mod tidy

  lint:
    desc: "run Go linters"
    vars:
      REVIVE_BIN:
        sh: go run . {{.REVIVE}}
      STATICCHECK_BIN:
        sh: go run . {{.STATICCHECK}}
      BETTERALIGN_BIN:
        sh: go run . {{.BETTERALIGN}}
    cmds:
      - "{{.REVIVE_BIN}} -formatter friendly -set_exit_status ./..."
      - "{{.STATICCHECK_BIN}} ./..."
      - "{{.BETTERALIGN_BIN}} ./..."

  format:
    desc: "format the code"
    vars:
      BETTERALIGN_BIN:
        sh: go run . {{.BETTERALIGN}}
      GOFUMPT_BIN:
        sh: go run . {{.GOFUMPT}}
    cmds:
      - go fix ./...
      - "{{.BETTERALIGN_BIN}} -apply ./... || true"
      - "{{.GOFUMPT_BIN}} -l -w ."

  govulncheck:
    desc: "scan for known vulnerabilities"
    vars:
      GOVULNCHECK_BIN:
        sh: go run . {{.GOVULNCHECK}}
    cmds:
      - "{{.GOVULNCHECK_BIN}} -show verbose ./..."
